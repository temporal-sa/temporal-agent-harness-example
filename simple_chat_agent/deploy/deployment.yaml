# Independent frontend, API, and worker Deployments for the simple_chat_agent.
#
# All shared state is now external (S3 claim-checks + artifacts, DynamoDB
# OAuth/artifact metadata, Redis Streams), so the runtime boundaries no longer
# share a pod or any local volume. The API and worker keep a small emptyDir for
# SQLite scratch (transient OAuth handshake state, etc.).
#
# - web: static frontend only; no secrets or service-account token. The
#        `component: web` label is retained for Deployment selector stability.
# - api: FastAPI, OAuth, SSE, artifacts, and the authenticated SSE gateway over
#        the shared Redis Streams backplane.
# - worker: Temporal worker + in-process codec; horizontally scalable (the codec
#           reads claim-checks from S3, so any worker pod can decode).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-harness-web
  namespace: temporal-michaelj-agent-harness-demo
  labels:
    app: agent-harness
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-harness
      component: web
  template:
    metadata:
      labels:
        app: agent-harness
        component: web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: 429214323166.dkr.ecr.us-west-1.amazonaws.com/temporal-michaelj-agent-harness-demo:1.0
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - simple_chat_agent.frontend.server:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --proxy-headers
            - --forwarded-allow-ips
            - "*"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-harness-api
  namespace: temporal-michaelj-agent-harness-demo
  labels:
    app: agent-harness
    component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent-harness
      component: api
  template:
    metadata:
      labels:
        app: agent-harness
        component: api
    spec:
      serviceAccountName: agent-harness
      containers:
        - name: api
          image: 429214323166.dkr.ecr.us-west-1.amazonaws.com/temporal-michaelj-agent-harness-demo:1.0
          imagePullPolicy: IfNotPresent
          # The module's __main__ binds 127.0.0.1 with reload=True (dev only),
          # so launch uvicorn directly bound to all interfaces.
          command:
            - uvicorn
            - simple_chat_agent.api.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --proxy-headers
            - --forwarded-allow-ips
            - "*"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: agent-harness-secrets
          env:
            - name: SIMPLE_CHAT_S3_BUCKET
              value: michaelj-agent-harness-claimcheck-429214323166
            - name: SIMPLE_CHAT_USER_EMAIL_SEARCH_ATTR
              value: UserEmail
            - name: SIMPLE_CHAT_DYNAMODB_TABLE
              value: temporal-michaelj-agent-harness-demo-oauth
            - name: SIMPLE_CHAT_ARTIFACTS_TABLE
              value: temporal-michaelj-agent-harness-demo-artifacts
            - name: SIMPLE_CHAT_WORKSPACE_SHELL_ENABLED
              value: "1"
            - name: SIMPLE_CHAT_STREAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-harness-secrets
                  key: SIMPLE_CHAT_STREAM_TOKEN
            - name: SIMPLE_CHAT_REDIS_URL
              value: redis://:$(SIMPLE_CHAT_STREAM_TOKEN)@agent-harness-redis:6379/0
            - name: SIMPLE_CHAT_PUBLIC_URL
              value: https://agent-harness-demo.tmprl-demo.cloud
            - name: SIMPLE_CHAT_WORKER_VERSION
              value: "1.0.0"
            - name: SIMPLE_CHAT_SEARXNG_BASE_URL
              value: http://agent-harness-searxng.temporal-michaelj-agent-harness-demo.svc.cluster.local:8080
            - name: SIMPLE_CHAT_DEMO_WORKSPACES_ENABLED
              value: "1"
            - name: SIMPLE_CHAT_DEMO_WORKSPACE_HOST_SUFFIX
              value: -agent-harness-demo.tmprl-demo.cloud
            - name: SIMPLE_CHAT_DEMO_SOURCE_NAMESPACE
              value: temporal-michaelj-agent-harness-demo
            - name: SIMPLE_CHAT_DEMO_SOURCE_SECRET_NAME
              value: agent-harness-secrets
            - name: SIMPLE_CHAT_DEMO_TLS_SECRET_NAME
              value: agent-harness-workspace-tls
            - name: SIMPLE_CHAT_DEMO_WORKSPACE_ROLE_ARN
              value: arn:aws:iam::429214323166:role/temporal-michaelj-agent-harness-demo-s3
            - name: SIMPLE_CHAT_DEMO_SOURCE_WEB_DEPLOYMENT
              value: agent-harness-web
            - name: SIMPLE_CHAT_DEMO_SOURCE_API_DEPLOYMENT
              value: agent-harness-api
            - name: SIMPLE_CHAT_DEMO_SOURCE_WORKER_DEPLOYMENT
              value: agent-harness-worker
          volumeMounts:
            - name: chat-data
              mountPath: /app/.simple_chat_agent
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: chat-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-harness-worker
  namespace: temporal-michaelj-agent-harness-demo
  labels:
    app: agent-harness
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-harness
      component: worker
  template:
    metadata:
      labels:
        app: agent-harness
        component: worker
    spec:
      serviceAccountName: agent-harness
      # Temporal drains in-flight Activities for 20 minutes on SIGTERM. Keep
      # the pod alive slightly longer so completion can reach the server.
      terminationGracePeriodSeconds: 1260
      containers:
        - name: worker
          image: 429214323166.dkr.ecr.us-west-1.amazonaws.com/temporal-michaelj-agent-harness-demo:1.0
          imagePullPolicy: IfNotPresent
          # Runs the Temporal worker and the in-process codec server (:8001).
          command:
            - python
            - -m
            - simple_chat_agent.worker.main
          ports:
            - name: codec
              containerPort: 8001
          envFrom:
            - secretRef:
                name: agent-harness-secrets
          env:
            - name: SIMPLE_CHAT_S3_BUCKET
              value: michaelj-agent-harness-claimcheck-429214323166
            - name: SIMPLE_CHAT_USER_EMAIL_SEARCH_ATTR
              value: UserEmail
            - name: SIMPLE_CHAT_DYNAMODB_TABLE
              value: temporal-michaelj-agent-harness-demo-oauth
            - name: SIMPLE_CHAT_ARTIFACTS_TABLE
              value: temporal-michaelj-agent-harness-demo-artifacts
            - name: SIMPLE_CHAT_WORKSPACE_SHELL_ENABLED
              value: "1"
            - name: SIMPLE_CHAT_STREAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-harness-secrets
                  key: SIMPLE_CHAT_STREAM_TOKEN
            - name: SIMPLE_CHAT_REDIS_URL
              value: redis://:$(SIMPLE_CHAT_STREAM_TOKEN)@agent-harness-redis:6379/0
            # Old images use this during a rolling migration; new images prefer Redis.
            - name: SIMPLE_CHAT_STREAM_SINK_URL
              value: http://agent-harness-api
            - name: SIMPLE_CHAT_PUBLIC_URL
              value: https://agent-harness-demo.tmprl-demo.cloud
            - name: SIMPLE_CHAT_WORKER_VERSION
              value: "1.0.0"
            - name: SIMPLE_CHAT_WORKER_GRACEFUL_SHUTDOWN_SECONDS
              value: "1200"
            - name: SIMPLE_CHAT_SEARXNG_BASE_URL
              value: http://agent-harness-searxng.temporal-michaelj-agent-harness-demo.svc.cluster.local:8080
            - name: WORKSPACE_EXECUTOR_URL
              value: http://agent-harness-workspace-executor:8082
            - name: WORKSPACE_EXECUTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-harness-workspace-executor-auth
                  key: token
          volumeMounts:
            - name: chat-data
              mountPath: /app/.simple_chat_agent
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: chat-data
          emptyDir: {}

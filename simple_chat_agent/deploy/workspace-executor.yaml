apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-harness-workspace-executor
  namespace: temporal-michaelj-agent-harness-demo
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-harness-workspace-executor
  namespace: temporal-michaelj-agent-harness-demo
  labels:
    app: agent-harness-workspace-executor
    component: workspace-executor
spec:
  # Workspaces live for the lifetime of the executor pod. Recreate keeps the
  # rollout behavior explicit and prevents overlapping command execution.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: agent-harness-workspace-executor
      component: workspace-executor
  template:
    metadata:
      labels:
        app: agent-harness-workspace-executor
        component: workspace-executor
    spec:
      serviceAccountName: agent-harness-workspace-executor
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        # Bubblewrap needs unprivileged user-namespace syscalls that the runtime
        # default profile may block. The container remains non-root, capless,
        # credential-free, read-only outside its PVC, and network-isolated.
        seccompProfile:
          type: Unconfined
      initContainers:
        - name: workspace-firewall
          image: 429214323166.dkr.ecr.us-west-1.amazonaws.com/temporal-michaelj-agent-harness-demo:1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              iptables -F OUTPUT
              iptables -P OUTPUT DROP
              iptables -A OUTPUT -o lo -j ACCEPT
              iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
              iptables -A OUTPUT -p udp --dport 53 -j ACCEPT
              iptables -A OUTPUT -p tcp --dport 53 -j ACCEPT
              for cidr in \
                0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 \
                169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 \
                192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 \
                203.0.113.0/24 224.0.0.0/4 240.0.0.0/4; do
                iptables -A OUTPUT -d "${cidr}" -j DROP
              done
              iptables -A OUTPUT -p tcp -m multiport --dports 80,443 -j ACCEPT
              if ip6tables -L OUTPUT >/dev/null 2>&1; then
                ip6tables -F OUTPUT
                ip6tables -P OUTPUT DROP
                ip6tables -A OUTPUT -o lo -j ACCEPT
                ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
              fi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
      containers:
        - name: workspace-executor
          image: 429214323166.dkr.ecr.us-west-1.amazonaws.com/temporal-michaelj-agent-harness-demo:1.0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/tini
            - -g
            - --
            - python
            - -m
            - simple_chat_agent.worker.sandbox.executor
          ports:
            - name: executor
              containerPort: 8082
          env:
            - name: WORKSPACE_EXECUTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-harness-workspace-executor-auth
                  key: token
            - name: WORKSPACE_EXECUTOR_ROOT
              value: /workspaces
            - name: WORKSPACE_EXECUTOR_PORT
              value: "8082"
            - name: WORKSPACE_EXECUTOR_MAX_CONCURRENT
              value: "4"
            - name: WORKSPACE_EXECUTOR_LIVE_HEALTH_INTERVAL_SECONDS
              value: "30"
            - name: WORKSPACE_EXECUTOR_MAX_ORPHAN_ZOMBIES
              value: "8"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
            - name: executor-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: executor
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: executor
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: workspaces
          # The sa-demo cluster has no dynamic block-storage CSI provisioner.
          # This persists files between tool calls for the executor pod's
          # lifetime, but an executor rollout starts with a fresh workspace.
          emptyDir:
            sizeLimit: 5Gi
        - name: executor-tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-harness-workspace-executor
  namespace: temporal-michaelj-agent-harness-demo
spec:
  selector:
    app: agent-harness-workspace-executor
    component: workspace-executor
  ports:
    - name: executor
      port: 8082
      targetPort: executor
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-harness-workspace-executor
  namespace: temporal-michaelj-agent-harness-demo
spec:
  podSelector:
    matchLabels:
      app: agent-harness-workspace-executor
      component: workspace-executor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent-harness
              component: worker
      ports:
        - protocol: TCP
          port: 8082
  egress:
    # DNS is the only allowed cluster-local destination.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Public web egress for curl, pip, git-over-HTTPS, and similar commands.
    # Private, loopback, link-local, multicast, benchmark, and metadata ranges
    # stay unreachable even when a sandbox command requests network access.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
